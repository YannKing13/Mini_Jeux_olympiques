*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10233e;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}button,select{font:inherit}button{border:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}#game{width:100vw;height:100dvh;display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}#top button{pointer-events:auto} .pill{background:#10233edb;border:2px solid #ffffff38;border-radius:18px;padding:8px 13px;color:white;font-weight:800;box-shadow:0 4px 12px #0004}#controls{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;display:none;justify-content:space-between;gap:12px;align-items:end}.ctrl{pointer-events:auto;min-width:23vw;height:65px;border-radius:20px;background:linear-gradient(#3cbdff,#1471c6);border:3px solid #bcecff;color:white;font-size:clamp(14px,2.5vw,23px);font-weight:900;text-shadow:0 2px #124978;box-shadow:0 6px #0b4379}.ctrl:active,.ctrl.pressed{transform:translateY(4px);box-shadow:0 2px #0b4379;background:#f9a934}.center{display:flex;gap:8px;flex-direction:column;align-items:center}.meter{width:27vw;height:15px;border:2px solid white;border-radius:20px;overflow:hidden;background:#20334f}.fill{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffd34d,#55e47a);width:0%}#overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#06142ab8;pointer-events:auto;padding:12px;overflow:auto}#overlay.hidden{display:none}.panel{width:min(900px,94vw);max-height:94dvh;overflow:auto;background:linear-gradient(145deg,#1c4a85,#112a51);border:3px solid #7fdfff;border-radius:24px;padding:18px;box-shadow:0 16px 50px #0009;text-align:center}.panel h1{font-size:clamp(24px,4.5vw,44px);margin:3px 0 10px;color:#ffdf6c;text-shadow:0 3px #8c5525}.panel h2{margin:4px 0 12px;color:#ffdf6c}.panel p{margin:8px 0}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.action{background:#ffcf48;color:#172b4e;font-weight:900;border-radius:13px;padding:11px 17px;box-shadow:0 4px #b5791c}.action.alt{background:#a6eaff;box-shadow:0 4px #3a8da8}.action:active{transform:translateY(3px)}select{background:#e4f6ff;color:#112a51;border-radius:10px;padding:8px;font-weight:700;max-width:100%}.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:9px 0}.events{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.event{background:#275a96;border:2px solid #7ad8ff;border-radius:13px;padding:10px 5px;color:white;font-weight:800;min-height:67px}.event:disabled{opacity:.4}.small{font-size:12px;opacity:.85}.board{width:100%;border-collapse:collapse;text-align:left;font-size:clamp(11px,1.8vw,16px)}.board td,.board th{border-bottom:1px solid #ffffff30;padding:5px 8px}.board th{color:#ffdf6c}#rotate{display:none;position:fixed;inset:0;background:#10233e;z-index:20;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:24px;font-weight:800}@media(orientation:portrait){#rotate{display:flex}}@media(max-height:400px){.panel{padding:10px}.events{gap:5px}.event{min-height:48px;padding:5px}.ctrl{height:53px}}
</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><span class="pill" id="hud">🏅 MINI OLYMPIC GAMES</span><button class="pill" id="pause">⏸ Pause</button></div><div id="controls"><button class="ctrl" id="left">◀ GAUCHE</button><div class="center"><span class="pill" id="hint">ALTERNE LES TOUCHES</span><div class="meter"><div class="fill" id="fill"></div></div></div><button class="ctrl" id="right">DROITE ▶</button><button class="ctrl" id="act" style="background:linear-gradient(#ffbc55,#f17c35);min-width:17vw">ACTION ⚡</button></div><div id="overlay"></div></div><div id="rotate">📱 ↻<br>Tourne ton téléphone en paysage pour jouer</div><script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),overlay=document.getElementById('overlay'),controls=document.getElementById('controls'),hud=document.getElementById('hud'),hint=document.getElementById('hint'),fill=document.getElementById('fill');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const EVENTS=[{id:'sprint',name:'100 m',emoji:'🏃',unit:'s',best:'min'},{id:'hurdles',name:'110 m haies',emoji:'🚧',unit:'s',best:'min'},{id:'long',name:'Saut en longueur',emoji:'🦘',unit:'m',best:'max'},{id:'javelin',name:'Javelot',emoji:'🎯',unit:'m',best:'max'},{id:'swim',name:'100 m nage libre',emoji:'🏊',unit:'s',best:'min'},{id:'shot',name:'Lancer du poids',emoji:'💪',unit:'m',best:'max'},{id:'high',name:'Saut en hauteur',emoji:'⬆️',unit:'m',best:'max'},{id:'four',name:'400 m',emoji:'🏟️',unit:'s',best:'min'}];
const COUNTRIES=[['FR','🇫🇷','France'],['US','🇺🇸','États-Unis'],['JM','🇯🇲','Jamaïque'],['GB','🇬🇧','Royaume-Uni'],['DE','🇩🇪','Allemagne'],['IT','🇮🇹','Italie'],['ES','🇪🇸','Espagne'],['BR','🇧🇷','Brésil'],['JP','🇯🇵','Japon'],['CN','🇨🇳','Chine'],['AU','🇦🇺','Australie'],['CA','🇨🇦','Canada']];
const KEY='mini_olympic_games_v1_save';let save;try{save=JSON.parse(localStorage.getItem(KEY))||{}}catch{save={}}save.records||={};save.history||=[];save.country||='FR';save.difficulty||='normal';save.cup||null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}}const flag=id=>COUNTRIES.find(c=>c[0]===id)?.[1]||'🏳️';const country=id=>COUNTRIES.find(c=>c[0]===id)?.[2]||id;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let game=null,paused=false,keys=new Set(),last=performance.now();
function show(html){overlay.innerHTML='<div class="panel">'+html+'</div>';overlay.classList.remove('hidden');controls.style.display='none'}function hide(){overlay.classList.add('hidden');controls.style.display='flex'}function btn(t,fn,alt=false){let id='b'+Math.random().toString(36).slice(2);setTimeout(()=>{let e=document.getElementById(id);if(e)e.onclick=fn},0);return `<button class="action ${alt?'alt':''}" id="${id}">${t}</button>`}
function settings(){return `<div class="row"><label>🌍 Pays <select id="country">${COUNTRIES.map(c=>`<option value="${c[0]}" ${save.country===c[0]?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select></label><label>🎮 Difficulté <select id="diff"><option value="easy" ${save.difficulty==='easy'?'selected':''}>Facile</option><option value="normal" ${save.difficulty==='normal'?'selected':''}>Normal</option><option value="hard" ${save.difficulty==='hard'?'selected':''}>Difficile</option></select></label></div>`}
function attachSettings(){document.getElementById('country').onchange=e=>{save.country=e.target.value;persist()};document.getElementById('diff').onchange=e=>{save.difficulty=e.target.value;persist()}}
function menu(){game=null;paused=false;hud.textContent='🏅 MINI OLYMPIC GAMES V1';show(`<h1>🏅 MINI OLYMPIC GAMES</h1><p>8 épreuves • 12 nations • 3 difficultés</p>${settings()}<div class="actions">${btn('🏆 JEUX OLYMPIQUES',startCup)}${btn('⚡ ÉPREUVE RAPIDE',eventMenu,true)}${btn('📊 RECORDS & PALMARÈS',records,true)}</div>${save.cup?'<p>💾 Une compétition est enregistrée et peut être reprise.</p>':''}<p class="small">📱 Paysage • Boutons tactiles • Clavier : ← → espace • Sauvegarde automatique</p>`);attachSettings()}
function eventMenu(){show(`<h2>⚡ Choisis une épreuve</h2><div class="events">${EVENTS.map((e,i)=>`<button class="event" data-i="${i}">${e.emoji}<br>${e.name}</button>`).join('')}</div><div class="actions">${btn('⬅ Menu',menu,true)}</div>`);document.querySelectorAll('.event').forEach(b=>b.onclick=()=>start(+b.dataset.i,false))}
function startCup(){if(save.cup&&save.cup.index<8){show(`<h2>🏆 Jeux olympiques</h2><p>Compétition en cours : ${save.cup.index}/8 épreuves terminées.</p><div class="actions">${btn('▶ Reprendre',()=>start(save.cup.index,true))}${btn('🔄 Nouvelle compétition',newCup,true)}${btn('📊 Résultats',cupBoard,true)}${btn('⬅ Menu',menu,true)}</div>`)}else newCup()}
function newCup(){save.cup={index:0,results:[],medals:Object.fromEntries(COUNTRIES.map(c=>[c[0],[0,0,0]])),country:save.country,difficulty:save.difficulty};persist();start(0,true)}
function start(i,cup){const e=EVENTS[i];game={i,e,cup,t:0,progress:0,speed:0,stamina:1,power:0,angle:45,stage:'ready',count:3.2,lastTap:'',taps:0,action:false,flight:0,attempt:1,attempts:[],obstacles:0,penalty:0,hitUntil:0,boost:0,finished:false,ai:[],distance:0,aim:0};let g=game;const isRace=['sprint','hurdles','swim','four'].includes(e.id);g.isRace=isRace;g.goal=e.id==='four'?400:e.id==='hurdles'?110:100;g.ai=COUNTRIES.filter(c=>c[0]!==save.country).sort(()=>Math.random()-.5).slice(0,5).map((c,j)=>({id:c[0],progress:0,score:0,speed:0,seed:rand(0,10),lane:j+1}));g.stage='ready';hide();hud.textContent=`${e.emoji} ${e.name} · ${flag(save.country)} ${country(save.country)}`;hint.textContent=isRace?'ALTERNE GAUCHE / DROITE':'ÉLAN : ALTERNE';fill.style.width='0%'}
function tap(side){if(!game||paused||game.stage!=='play')return;const g=game;if(side==='action'){g.action=true;action();return}if(side===g.lastTap)return;g.lastTap=side;g.taps++;g.speed=clamp(g.speed+(g.isRace?.67:.92),0,g.e.id==='four'?9.4:12);g.power=clamp(g.power+3.8,0,100);if(g.e.id==='swim')g.stamina=clamp(g.stamina-.006,0,1)}
function action(){let g=game;if(!g||g.stage!=='play')return;if(g.e.id==='hurdles'){g.boost=.42;g.hitUntil=g.t+.36}else if(g.e.id==='swim'){g.boost=.65;g.stamina=clamp(g.stamina+.08,0,1)}else if(g.e.id==='four'){g.boost=.3;g.stamina=clamp(g.stamina+.025,0,1)}else if(!g.isRace){if(g.stage==='play'){g.stage='flight';g.flight=0;let angle=g.angle;let precision=Math.max(0,1-Math.abs(angle-(g.e.id==='high'?65:42))/60);let power=g.power/100;let base=g.e.id==='long'?3.1:g.e.id==='javelin'?30:g.e.id==='shot'?9:1.25;let extra=g.e.id==='long'?5.3:g.e.id==='javelin'?66:g.e.id==='shot'?13:1.2;let foul=g.e.id==='long'&&g.progress>49.5;g.distance=foul?0:base+extra*power*precision+rand(-.12,.12);g.distance=Math.max(0,g.distance);g.aim=angle}}}
function fmt(e,n){return n.toFixed(2)+(e.unit==='s'?' s':' m')}
function aiScore(e,idx){let base={sprint:11.7,hurdles:15.7,long:6.5,javelin:65,swim:57,shot:16.5,high:1.93,four:54}[e.id],spread={sprint:1.4,hurdles:2.3,long:1.7,javelin:23,swim:8,shot:6,high:.42,four:9}[e.id];let difficulty=save.cup&&game.cup?save.cup.difficulty:save.difficulty;let bias=difficulty==='easy'?.5:difficulty==='hard'?-.35:0;let n=base+rand(-spread*.55,spread*.55)+(e.best==='min'?bias:-bias*spread*.3);return Math.max(.1,n)}
function finish(score){let g=game;if(!g||g.finished)return;g.finished=true;g.stage='done';let e=g.e;let scores=[{id:save.country,score,player:true},...g.ai.map((a,i)=>({id:a.id,score:aiScore(e,i)}))].sort((a,b)=>e.best==='min'?a.score-b.score:b.score-a.score);let rank=scores.findIndex(s=>s.player)+1;let old=save.records[e.id];if(score>0&&(!old||(e.best==='min'?score<old:score>old)))save.records[e.id]=score;save.history.unshift({date:new Date().toLocaleDateString('fr-FR'),event:e.id,score,rank,country:save.country});save.history=save.history.slice(0,80);if(g.cup&&save.cup){save.cup.results.push({event:e.id,scores});scores.slice(0,3).forEach((s,i)=>save.cup.medals[s.id][i]++);save.cup.index++;}persist();let html=`<h2>${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'🏁'} ${e.name} — ${rank}${rank===1?'er':'e'}</h2><p style="font-size:24px"><b>${fmt(e,score)}</b></p><table class="board"><tr><th>Place</th><th>Pays</th><th>Performance</th></tr>${scores.map((s,i)=>`<tr ${s.player?'style="background:#ffffff25"':''}><td>${i+1}</td><td>${flag(s.id)} ${country(s.id)}</td><td>${fmt(e,s.score)}</td></tr>`).join('')}</table><div class="actions">${g.cup?(save.cup.index<8?btn('▶ Épreuve suivante',()=>start(save.cup.index,true)):btn('🏆 Classement final',cupBoard)):btn('🔁 Rejouer',()=>start(g.i,false))}${btn('📊 Médailles',cupBoard,true)}${btn('🏠 Menu',menu,true)}</div>`;show(html)}
function cupBoard(){let cup=save.cup;if(!cup){records();return}let standings=Object.entries(cup.medals).sort((a,b)=>b[1][0]-a[1][0]||b[1][1]-a[1][1]||b[1][2]-a[1][2]);show(`<h2>🏆 ${cup.index===8?'Résultats finaux':'Classement olympique'}</h2><p>${cup.index}/8 épreuves terminées</p><table class="board"><tr><th>Pays</th><th>🥇</th><th>🥈</th><th>🥉</th></tr>${standings.map(([id,m])=>`<tr ${id===cup.country?'style="background:#ffffff25"':''}><td>${flag(id)} ${country(id)}</td><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td></tr>`).join('')}</table><div class="actions">${cup.index<8?btn('▶ Continuer',()=>start(cup.index,true)):btn('🔄 Nouveaux Jeux',newCup)}${btn('📋 Détail des épreuves',cupResults,true)}${btn('🏠 Menu',menu,true)}</div>`)}
function cupResults(){let cup=save.cup;if(!cup)return menu();show(`<h2>📋 Résultats des épreuves</h2><div style="max-height:55vh;overflow:auto">${cup.results.map(r=>{let e=EVENTS.find(e=>e.id===r.event);return `<h3>${e.emoji} ${e.name}</h3><table class="board">${r.scores.map((s,i)=>`<tr><td>${i+1}</td><td>${flag(s.id)} ${country(s.id)}</td><td>${fmt(e,s.score)}</td></tr>`).join('')}</table>`}).join('')||'<p>Aucune épreuve terminée.</p>'}</div><div class="actions">${btn('⬅ Classement',cupBoard,true)}</div>`)}
function records(){show(`<h2>📊 Records personnels</h2><table class="board"><tr><th>Discipline</th><th>Record</th></tr>${EVENTS.map(e=>`<tr><td>${e.emoji} ${e.name}</td><td>${save.records[e.id]?fmt(e,save.records[e.id]):'—'}</td></tr>`).join('')}</table><p class="small">${save.history.length} performance(s) enregistrée(s)</p><div class="actions">${btn('🏆 Tableau des médailles',cupBoard,true)}${btn('📜 Historique',history,true)}${btn('🏠 Menu',menu)}</div>`)}
function history(){show(`<h2>📜 Historique</h2><div style="max-height:55vh;overflow:auto"><table class="board"><tr><th>Date</th><th>Épreuve</th><th>Résultat</th><th>Rang</th></tr>${save.history.map(h=>{let e=EVENTS.find(x=>x.id===h.event);return `<tr><td>${h.date}</td><td>${e?.name||h.event}</td><td>${e?fmt(e,h.score):h.score}</td><td>${h.rank}</td></tr>`}).join('')}</table></div><div class="actions">${btn('⬅ Records',records,true)}</div>`)}
function pause(){if(!game||game.finished)return;paused=true;show(`<h2>⏸ Pause</h2><p>${game.e.emoji} ${game.e.name}</p><div class="actions">${btn('▶ Reprendre',()=>{paused=false;hide()})}${btn('🔄 Recommencer',()=>{paused=false;start(game.i,game.cup)},true)}${btn('🏠 Menu',menu,true)}</div>`)}document.getElementById('pause').onclick=pause;
for(let [id,side] of [['left','left'],['right','right'],['act','action']]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('pressed');tap(side)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>b.classList.remove('pressed'))}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code)){e.preventDefault();if(!keys.has(e.code)){keys.add(e.code);tap(e.code==='Space'?'action':['ArrowLeft','KeyA'].includes(e.code)?'left':'right')}}if(e.code==='Escape')pause()});addEventListener('keyup',e=>keys.delete(e.code));
function update(dt){let g=game;if(!g||paused||g.finished)return;if(g.stage==='ready'){g.count-=dt;if(g.count<=0){g.stage='play';g.t=0}return}if(g.stage==='flight'){g.flight+=dt;if(g.flight>1.15){g.attempts.push(g.distance);if(g.attempt<3){g.attempt++;g.stage='ready';g.count=1.7;g.power=0;g.speed=0;g.progress=0;g.angle=45;g.lastTap='';g.flight=0}else finish(Math.max(...g.attempts))}return}g.t+=dt;g.boost=Math.max(0,g.boost-dt);g.speed=Math.max(0,g.speed-dt*(g.isRace?1.8:1.1));g.power=Math.max(0,g.power-dt*1.5);if(g.isRace){let velocity=(g.e.id==='swim'?2.2:g.e.id==='four'?4.7:3.7)+g.speed*(g.e.id==='swim'?.72:g.e.id==='four'?.75:.85);if(g.e.id==='swim')velocity*=.85+.15*g.stamina;if(g.e.id==='four'){g.stamina=clamp(g.stamina-dt*(g.speed>7?.008:.003),0,1);velocity*=.68+.32*g.stamina}if(g.boost>0)velocity*=1.12;if(g.e.id==='hurdles'){let next=Math.floor(g.progress/10+1)*10;if(g.progress<next&&g.progress+velocity*dt>=next&&next<g.goal){if(g.hitUntil<g.t){g.penalty+=.3;g.speed*=.68}else g.speed=Math.min(12,g.speed+.5)}}g.progress+=velocity*dt;g.ai.forEach(a=>{a.progress=Math.min(g.goal,a.progress+(g.goal/(g.e.id==='four'?rand(51,59):g.e.id==='swim'?rand(54,65):g.e.id==='hurdles'?rand(14.6,18):rand(11.1,13.5)))*dt)});if(g.progress>=g.goal)finish(g.t+g.penalty)}else{g.progress+=g.speed*dt*.85;g.angle=45+25*Math.sin(g.t*2.7);if(g.progress>55){g.progress=55;g.speed*=.6}if(g.t>23)action()}fill.style.width=(g.isRace?g.speed/12*100:g.power)+'%';hint.textContent=g.isRace?(g.e.id==='hurdles'?'ACTION : SAUTER LES HAIES':g.e.id==='swim'?'ACTION : RESPIRER':g.e.id==='four'?'ACTION : RELANCE':'ALTERNE POUR ACCÉLÉRER'):`ESSAI ${g.attempt}/3 · ACTION : LANCER / SAUTER`}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function txt(s,x,y,size=20,color='#fff',align='center'){ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y)}function athlete(x,y,scale,color,phase=0,swim=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.strokeStyle='#142747';ctx.lineWidth=5;ctx.lineCap='round';let p=Math.sin(phase)*9;ctx.fillStyle='#ffcf9e';ctx.beginPath();ctx.arc(0,-24,9,0,7);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,9);ctx.stroke();ctx.strokeStyle='#172d52';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(-9+p,24);ctx.moveTo(0,9);ctx.lineTo(9-p,24);ctx.moveTo(0,-7);ctx.lineTo(-13-p,-1);ctx.moveTo(0,-7);ctx.lineTo(13+p,-1);ctx.stroke();ctx.restore()}
function draw(){let t=performance.now()/1000;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#60c8ff');sky.addColorStop(.6,'#b9e8ff');sky.addColorStop(1,'#f9e5a5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#407fc4';ctx.fillRect(0,H*.23,W,H*.13);for(let i=0;i<Math.ceil(W/15);i++){ctx.fillStyle=['#f4e0a0','#e9f6ff','#ffe1d9'][i%3];ctx.beginPath();ctx.arc(i*15,H*.29+Math.sin(i*3)*6,3.5,0,7);ctx.fill()}rounded(W*.36,H*.05,W*.28,H*.16,18,'#103965cc');txt('🏅 OLYMPIC GAMES',W/2,H*.12,Math.min(27,W*.035),'#ffdf6c');if(!game){txt('🏟️ 8 ÉPREUVES · 12 NATIONS',W/2,H*.19,Math.min(19,W*.024));return}let g=game;let trackTop=H*.38,trackBottom=H*.83,trackH=trackBottom-trackTop;ctx.fillStyle=g.e.id==='swim'?'#149bd7':'#cb6353';ctx.fillRect(0,trackTop,W,trackH);if(g.isRace){for(let j=0;j<=6;j++){ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,trackTop+j*trackH/6);ctx.lineTo(W,trackTop+j*trackH/6);ctx.stroke()}let finishX=W*.83;ctx.fillStyle='#ffffff';ctx.fillRect(finishX,trackTop,7,trackH);for(let k=0;k<15;k++){ctx.fillStyle=k%2?'#171c2e':'#fff';ctx.fillRect(finishX,trackTop+k*trackH/15,7,trackH/15)}let startX=W*.09,scaleX=(finishX-startX)/g.goal;g.ai.forEach((a,i)=>{let x=startX+a.progress*scaleX;athlete(x,trackTop+(i+.5)*trackH/6,.7,['#e9eb58','#70f5bb','#a0a0ff','#ff96e0','#f9f9f9'][i],t*9+a.seed,g.e.id==='swim')});let x=startX+g.progress*scaleX;athlete(x,trackTop+trackH/12,.85,'#f8da36',t*12,g.e.id==='swim');if(g.e.id==='hurdles'){for(let i=1;i<11;i++){let xx=startX+i*10*scaleX;if(xx>0&&xx<W){ctx.strokeStyle='#ffe3ac';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(xx,trackTop);ctx.lineTo(xx,trackBottom);ctx.stroke()}}}txt(`${Math.min(g.goal,g.progress).toFixed(1)} / ${g.goal} m`,W/2,H*.34,Math.min(23,W*.03),'#103965');txt(`${(g.t+g.penalty).toFixed(2)} s`,W*.87,H*.17,Math.min(26,W*.03),'#103965')}else{ctx.fillStyle='#5abf75';ctx.fillRect(0,trackTop,W,trackH);ctx.fillStyle='#cf9a5c';ctx.fillRect(W*.58,trackTop+trackH*.12,W*.35,trackH*.7);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.53,trackTop);ctx.lineTo(W*.53,trackBottom);ctx.stroke();athlete(W*.15+Math.min(g.progress,48)/55*W*.36,trackTop+trackH*.44,1.2,'#f8da36',t*11);if(g.stage==='flight'){let x=W*.52+Math.min(g.flight,1)*W*.38,y=trackTop+trackH*.35-Math.sin(g.flight*Math.PI)*trackH*.22;txt(g.e.id==='javelin'?'➤':g.e.id==='shot'?'⚫':'⭐',x,y,27)}txt(`Puissance : ${Math.round(g.power)}%   Angle : ${Math.round(g.angle)}°`,W/2,H*.34,Math.min(23,W*.027),'#103965');txt(`Essai ${g.attempt}/3 ${g.attempts.length?' · Meilleur : '+fmt(g.e,Math.max(...g.attempts)):''}`,W/2,H*.2,Math.min(20,W*.023),'#103965')}if(g.stage==='ready'){rounded(W*.38,H*.36,W*.24,H*.24,18,'#092a4ddd');txt(g.count>1?String(Math.ceil(g.count)):'GO !',W/2,H*.52,Math.min(62,W*.09),'#ffe366')}if(g.stage==='flight')txt(g.distance===0?'❌ MORDU !':fmt(g.e,g.distance),W/2,H*.29,Math.min(32,W*.045),'#10416a')}
function loop(now){let dt=Math.min(.045,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);menu();
</script></body></html>
